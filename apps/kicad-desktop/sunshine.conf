# Supervisord drop-in: Sunshine (Moonlight host) attaches to the SAME X server
# (DISPLAY=:20) that Selkies captures.
#
# Sunshine auto-detects Intel VAAPI when /dev/dri is present. To force it
# explicitly, set encoder = vaapi in /config/sunshine/sunshine.conf
# (mounted from a PVC; the file is created on first start).
#
# First-run credentials are created via the Web UI at https://<host>:47990 OR
# via `sunshine creds <user> <pass>` (CLI subcommand; no env-var shortcut).
# In Kubernetes, the MCP sidecar runs `sunshine creds` once after the pod is
# ready using values from the SOPS-encrypted Secret.
#
# Required devices (passed via K8s resources.requests):
#   gpu.intel.com/i915: 1   (Intel GPU plugin → /dev/dri/card0 + renderD128)
# Optional:
#   /dev/uinput              (virtual input devices; needs `input` group)

[program:sunshine]
command=/usr/bin/sunshine /config/sunshine/sunshine.conf
directory=/home/ubuntu
user=ubuntu
priority=30                              ; start after X server + WM (priority 1-20)
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=
    DISPLAY="%(ENV_DISPLAY)s",
    HOME="/home/ubuntu",
    XDG_RUNTIME_DIR="/tmp/xdg-runtime",
    PULSE_SERVER="%(ENV_PULSE_SERVER)s"
