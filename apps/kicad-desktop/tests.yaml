---
# yaml-language-server: $schema=https://raw.githubusercontent.com/goss-org/goss/master/docs/schema.yaml
# Validates the kicad-desktop image.
#
# NOTE: we only check file existence here, NOT process/port state. The full
# supervisord-managed stack (Xvfb + Xfce4 + Selkies + Sunshine + nginx + coturn)
# needs /dev/dri (Intel GPU) and a real display subsystem to boot, which the
# GitHub Actions runner doesn't have. Booting supervisord in CI would fail
# partway through and make the test flaky. The runtime probes live in
# docs/kicad-streaming-workstation.md (validation checklist) for the operator
# to run against the deployed pod.
file:
  # KiCad binaries
  /usr/bin/kicad:
    exists: true
  /usr/bin/kicad-cli:
    exists: true
  # Sunshine
  /usr/bin/sunshine:
    exists: true
  # VAAPI stack
  /usr/bin/vainfo:
    exists: true
  # Python tooling
  /usr/bin/kibot:
    exists: true
  # supervisord drop-in for Sunshine
  /etc/supervisor/conf.d/sunshine.conf:
    exists: true
  # KiCad autostart
  /etc/xdg/autostart/kicad.desktop:
    exists: true
  # KiCad PCM plugins
  /usr/local/share/kicad/10.0/3rdparty/plugins/com_github_bouni_kicad_jlcpcb_tools:
    exists: true
  /usr/local/share/kicad/10.0/3rdparty/plugins/org_openscopeproject_interactivehtmlbom:
    exists: true
