[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opengist-mcp"
version = "0.1.0"
description = "MCP server bridging LLM agents to Opengist"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.0,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
opengist-mcp = "opengist_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opengist_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
