---
schemaVersion: 2.0.0
# container-structure-test format. Inspects image layers without running the
# container: the ai4trade entrypoint is a one-shot CronJob command (no
# long-running process to probe, no ports to listen), so structural checks
# plus a compile smoke test of every Python entrypoint are the right shape.

fileExistenceTests:
  - name: "entrypoint"
    path: /opt/ai4trade/entrypoint.sh
    shouldExist: true
  - name: "marketdata.py"
    path: /opt/ai4trade/marketdata.py
    shouldExist: true
  - name: "trade.py"
    path: /opt/ai4trade/trade.py
    shouldExist: true
  - name: "control.py"
    path: /opt/ai4trade/control.py
    shouldExist: true
  - name: "poll.py"
    path: /opt/ai4trade/poll.py
    shouldExist: true
  - name: "forward/forward.py"
    path: /opt/ai4trade/forward/forward.py
    shouldExist: true
  - name: "universe.txt"
    path: /opt/ai4trade/universe.txt
    shouldExist: true
  - name: "personal_sleeve.json"
    path: /opt/ai4trade/personal_sleeve.json
    shouldExist: true

commandTests:
  # Import smoke test: modules only define constants/functions at top level
  # (all entry logic sits behind __main__ guards), so importing is side-effect
  # free and writes no bytecode (PYTHONDONTWRITEBYTECODE=1 in the image, and
  # /opt/ai4trade is read-only for the runtime user).
  - name: "python3 imports all ai4trade modules"
    command: "python3"
    args:
      - "-c"
      - "import sys; sys.path.insert(0, '/opt/ai4trade'); sys.path.insert(0, '/opt/ai4trade/forward'); import marketdata, trade, control, poll, forward; print('ai4trade imports OK')"
    expectedOutput: ["ai4trade imports OK"]
