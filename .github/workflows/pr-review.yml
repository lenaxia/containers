name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    uses: lenaxia/ai-workflows/.github/workflows/pr-review.yml@83489c467ee8d5a1977240aa5f6c23dcb9a34d69 # v0.2.7
    secrets: inherit
    with:
      version: v0.2.0
      project_name: containers
